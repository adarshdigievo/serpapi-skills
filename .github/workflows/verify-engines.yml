name: Verify SerpApi documentation

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live response checks that may use SerpApi credits
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'skills/serpapi-web-search/**'
      - 'skills/serpapi-setup/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/verify-engines.yml'
  push:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'skills/serpapi-web-search/**'
      - 'skills/serpapi-setup/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/verify-engines.yml'
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC. Detect upstream documentation and API drift.

permissions:
  contents: read

concurrency:
  group: verify-engine-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Checker regression tests
            command: uv run --locked pytest
          - name: Engine catalog and API contracts
            command: uv run --locked scripts/verify_engine_catalog.py
          - name: Skill format, syntax and links
            command: uv run --locked scripts/verify_doc_examples.py --require-powershell
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Require jq for extraction tests
        if: matrix.check.name == 'Checker regression tests'
        run: jq --version
      - run: ${{ matrix.check.command }}

  platform-credentials:
    name: Credential examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Require PowerShell on Windows
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: uv run --locked pytest tests/test_setup_credentials.py tests/test_setup_requests.py

  live:
    name: Live response checks
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.run_live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked

      - name: Check documented live response structures
        run: uv run --locked scripts/verify_live_responses.py
