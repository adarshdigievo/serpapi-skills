[project]
name = "serpapi-skills-checks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.13,<5", "json5>=0.12,<1", "markdown-it-py>=4,<5", "pyyaml>=6,<7"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
